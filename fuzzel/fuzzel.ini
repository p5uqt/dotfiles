[main]
font=JetBrainsMono Nerd Font:size=11
prompt=""
placeholder=
icons-enabled=yes
icon-theme=Papirus
lines=20
width=80
horizontal-pad=14
vertical-pad=8
inner-pad=0
image-size-ratio=0.5
show-actions=no

[colors]
# window background — rgba(30, 30, 46, 0.97)
background=1e1e2ef7
# window border — rgba(77, 171, 238, 0.3)
border=4daeee4d
# input text
text=f2f2f2ff
# placeholder / prompt text
prompt=88c0d038
# match highlight
match=4daeeecc
# selected item background — rgba(136, 192, 208, 0.25)
selection=88c0d040
# selected item text
selection-text=ffffffff
# selected item match highlight
selection-match=4daeeecc

[border]
width=2
radius=14

[dmenu]
exit-immediately-if-empty=no
