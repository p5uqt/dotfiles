# ==========================================================
#  Hyprlock — Catppuccin Mocha «quiet»
#  Calm centre, two quiet chips. Minimal, but not bare.
# ==========================================================
#
#  text     #cdd6f4   subtext0 #a6adc8
#  subtext1 #bac2de   overlay0 #6c7086
#  mauve    #cba6f7   base     #1e1e2e
#  crust    #11111b   mantle   #181825
#  blue     #89b4fa   green    #a6e3a1
#
#  Fonts: JetBrainsMono Nerd Font (weights installed)
# ==========================================================


# ==========================================================
# BACKGROUND — blurred screenshot, gently dimmed
# ==========================================================

background {
    monitor =
    path = screenshot

    blur_passes = 2
    blur_size = 5
    noise = 0.011

    contrast = 1.0
    brightness = 0.55
}


# ==========================================================
# AMBIENT TINT — a whisper of catppuccin base
# ==========================================================

shape {
    monitor =
    size = 1920, 1080
    position = 0, 0
    halign = center
    valign = center
    color = rgba(30, 30, 46, 0.30)
    rounding = 0
    zindex = 1
}


# ==========================================================
# GENERAL
# ==========================================================

general {
    text_trim = true
    hide_cursor = true
    ignore_empty_input = false
    immediate_render = false
    fail_timeout = 2000
}


# ==========================================================
# ANIMATIONS — soft fade only
# ==========================================================

bezier = quiet, 0.23, 1, 0.32, 1

animation = fadeIn,  1, 2, quiet
animation = fadeOut, 1, 2, quiet

animation = inputFieldColors, 1, 1, quiet
animation = inputFieldFade,   1, 1, quiet
animation = inputFieldWidth,  1, 1, quiet
animation = inputFieldDots,   1, 1, quiet


# ==========================================================
# GREETING — time aware, quiet mauve
# ==========================================================

label {
    monitor =
    text = cmd[update:60000] sh -c 'h=$(date +%-H); if [ "$h" -lt 5 ]; then g="Good night"; elif [ "$h" -lt 12 ]; then g="Good morning"; elif [ "$h" -lt 18 ]; then g="Good afternoon"; else g="Good evening"; fi; echo "󰄛  $g, $USER"'

    color = rgba(203, 166, 247, 0.85)
    font_size = 16
    font_family = JetBrainsMono NF

    position = 0, 195
    halign = center
    valign = center

    zindex = 20
}


# ==========================================================
# CLOCK — calm heart of the lockscreen
# ==========================================================

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"

    color = rgba(205, 214, 244, 0.98)
    font_size = 104
    font_family = JetBrainsMono NF Medium

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(17, 17, 27, 0.45)

    position = 0, 113
    halign = center
    valign = center

    zindex = 20
}


# ==========================================================
# DATE
# ==========================================================

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B')"

    color = rgba(186, 194, 222, 0.90)
    font_size = 20
    font_family = JetBrainsMono NF

    position = 0, 10
    halign = center
    valign = center

    zindex = 20
}


# ==========================================================
# DIVIDER — thin mauve thread
# ==========================================================

shape {
    monitor =
    size = 240, 1
    position = 0, -27
    halign = center
    valign = center

    color = rgba(0, 0, 0, 0)
    rounding = 1

    border_size = 1
    border_color = rgba(203, 166, 247, 0.50)

    zindex = 10
}


# ==========================================================
# PASSWORD — transparent pill, mauve outline
# ==========================================================

input-field {
    monitor =

    size = 300, 52
    outline_thickness = 2

    outer_color = rgba(203, 166, 247, 0.75)
    inner_color = rgba(17, 17, 27, 0.45)

    font_color = rgba(205, 214, 244, 0.95)
    font_family = JetBrainsMono NF
    placeholder_text = <span foreground="#6c7086"><i>Password</i></span>

    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    check_color = rgba(166, 227, 161, 0.90)
    fail_color  = rgba(243, 139, 168, 0.90)
    capslock_color = rgba(249, 226, 175, 1)

    fade_on_empty = true
    fade_timeout = 2000

    rounding = 26
    swap_font_color = true

    position = 0, -95
    halign = center
    valign = center

    zindex = 25
}


# ==========================================================
# KEYBOARD LAYOUT
# ==========================================================

label {
    monitor =
    text = $LAYOUT[EN,RU]

    color = rgba(108, 112, 134, 0.80)
    font_size = 12
    font_family = JetBrainsMono NF

    position = 0, -139
    halign = center
    valign = center

    zindex = 20
}


# ==========================================================
# TOP RIGHT — network chip
# ==========================================================

shape {
    monitor =
    size = 320, 44
    position = -28, 22
    halign = right
    valign = top

    color = rgba(24, 24, 37, 0.55)
    rounding = 22

    border_size = 1
    border_color = rgba(137, 180, 250, 0.35)

    zindex = 10
}

label {
    monitor =
    text = cmd[update:5000] sh -c 'iface="$(ip route | awk "/^default/ {print \$5; exit}")"; if [ -z "$iface" ]; then echo "󰖪  Offline"; exit 0; fi; if [ -d "/sys/class/net/$iface/wireless" ]; then ssid="$(nmcli -t -f active,ssid dev wifi 2>/dev/null | awk -F: "\$1==\"yes\" {print \$2; exit}")"; if [ -n "$ssid" ]; then echo "󰖩  $ssid"; else echo "󰖩  Wi-Fi"; fi; else echo "󰘉  Ethernet"; fi'

    color = rgba(137, 180, 250, 0.95)
    font_size = 13
    font_family = JetBrainsMono NF

    position = -56, 36
    halign = right
    valign = top

    zindex = 20
}


# ==========================================================
# TOP RIGHT — battery chip
# ==========================================================

shape {
    monitor =
    size = 180, 44
    position = -28, 78
    halign = right
    valign = top

    color = rgba(24, 24, 37, 0.55)
    rounding = 22

    border_size = 1
    border_color = rgba(166, 227, 161, 0.35)

    zindex = 10
}

label {
    monitor =
    text = cmd[update:5000] sh -c 'b="/sys/class/power_supply/BAT1"; if [ ! -d "$b" ]; then echo "󰁹  N/A"; exit 0; fi; cap="$(cat "$b/capacity" 2>/dev/null)"; st="$(cat "$b/status" 2>/dev/null)"; if [ -z "$cap" ]; then echo "󰁹  N/A"; exit 0; fi; if [ "$st" = "Charging" ] || [ "$st" = "Full" ]; then echo "󰂄  $cap%"; exit 0; fi; if [ "$cap" -ge 95 ]; then ic="󰁹"; elif [ "$cap" -ge 90 ]; then ic="󰂂"; elif [ "$cap" -ge 80 ]; then ic="󰂁"; elif [ "$cap" -ge 70 ]; then ic="󰂀"; elif [ "$cap" -ge 60 ]; then ic="󰁿"; elif [ "$cap" -ge 50 ]; then ic="󰁾"; elif [ "$cap" -ge 40 ]; then ic="󰁽"; elif [ "$cap" -ge 30 ]; then ic="󰁼"; elif [ "$cap" -ge 20 ]; then ic="󰁻"; elif [ "$cap" -ge 10 ]; then ic="󰁺"; else ic="󰂃"; fi; echo "$ic  $cap%"'

    color = rgba(166, 227, 161, 0.95)
    font_size = 13
    font_family = JetBrainsMono NF

    position = -56, 92
    halign = right
    valign = top

    zindex = 20
}
