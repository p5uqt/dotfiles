# =========================
# BACKGROUND (SCREEN BLUR)
# =========================
background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 3

    contrast = 1
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# =========================
# GENERAL
# =========================
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# =========================
# INPUT FIELD
# =========================
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true

inner_color = rgba(255, 255, 255, 0.08)
outer_color = rgba(255, 255, 255, 0.03)

    font_color = rgb(128, 128, 128)
    fade_on_empty = false
    rounding = -1

    check_color = rgb(204, 136, 34)
    placeholder_text = Input Password...

    hide_input = false

    position = 0, -200
    halign = center
    valign = center
}

# =========================
# DATE
# =========================
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %B %d')"
    color = rgba(242, 243, 244, 0.75)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}

# =========================
# TIME
# =========================
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(242, 243, 244, 0.75)
    font_size = 90
    font_family = JetBrains Mono
    position = 0, 200
    halign = center
    valign = center
}

# =========================
# USER INFO
# =========================
label {
    monitor =
    text = cmd[update:1000]
    color = $foreground
    font_size = 14
    font_family = JetBrains Mono
    position = 0, -10
    halign = center
    valign = center
}

# =========================
# BATTERY
# =========================
label {
    monitor =
    text = cmd[update:1000] echo "$(cat /sys/class/power_supply/BAT1/capacity)%"
    color = rgb(128, 128, 128)
    font_size = 20
    font_family = JetBrains Mono
    position = -10, -10
    halign = right
    valign = top
}

# =========================
# NETWORK
# =========================
label {
    monitor =
    text = cmd[update:1000]
    color = $foreground
    font_size = 24
    font_family = JetBrains Mono
    position = -20, -10
    halign = center
    valign = top
}
