general {
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = msi-perkeyrgb -m GS65 -c ~/.config/keyboard/keyboard.conf
    on-resume   = msi-perkeyrgb -m GS65 -s 00ffa9
    ignore_inhibit = true
}

listener {
    timeout = 1500
    on-timeout = msi-perkeyrgb -m GS65 -d
    on-resume   = msi-perkeyrgb -m GS65 -s 00ffa9
}

listener {
    timeout = 900
    on-timeout = brightnessctl -s set 0%
    on-resume   = brightnessctl -r
}
