general {
    ignore_dbus_inhibit = false
    before_sleep_cmd = pkill -f 'python[^ ]* .*msi-wsrgb'
    after_sleep_cmd = sudo isw -s 0x2e 9; flock -n /tmp/msi-rgb.lock -c '~/.local/bin/msi-wsrgb --base 00ffa9 --ws FFFF00'
}

listener {
    timeout = 180
    on-timeout = ~/.local/bin/msi-wsrgb --off; ~/.config/keyboard/keyboard_random_space.sh /dev/null 2>&1
    on-resume   = ~/.local/bin/msi-wsrgb --base 00ffa9 --ws FFFF00
    ignore_inhibit = true
}

listener {
    timeout = 900
    on-timeout = brightnessctl -s set 0%
    on-resume   = brightnessctl -r
    ignore_dbus_inhibit = false
}

listener {
    timeout = 3900
    on-timeout = flock -n /tmp/msi-rgb.lock -c '~/.local/bin/msi-kbc --off'
    on-resume   = ~/.local/bin/msi-wsrgb 00ffa9
}
