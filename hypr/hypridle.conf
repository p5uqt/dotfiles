general {
    ignore_dbus_inhibit = false
}

listener {
    timeout = 180
    on-timeout = ~/.config/keyboard/keyboard_random_space.sh
    on-resume   = flock -n /tmp/msi-rgb.lock -c 'msi-perkeyrgb -m GS65 -s 00ffa9'
    ignore_inhibit = true
}

listener {
    timeout = 3900
    on-timeout = flock -n /tmp/msi-rgb.lock -c 'msi-perkeyrgb -m GS65 -d'
    on-resume   = flock -n /tmp/msi-rgb.lock -c 'msi-perkeyrgb -m GS65 -s 00ffa9'
}

listener {
    timeout = 900
    on-timeout = brightnessctl -s set 0%
    on-resume   = brightnessctl -r
}
