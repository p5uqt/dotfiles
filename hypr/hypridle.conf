general {
    ignore_dbus_inhibit = false
    before_sleep_cmd = pkill -f msi-wsrgb
    after_sleep_cmd = sudo isw -s 0x2e 9
    after_sleep_cmd = flock -n /tmp/msi-rgb.lock -c '~/.local/bin/msi-wsrgb --base 00ffa9 --ws FF0000 FFFF00 00FF00 0000FF 8800FF'
}

listener {
    timeout = 180
    on-timeout = ~/.config/keyboard/keyboard_random_space.sh
    on-resume   = ~/.local/bin/msi-wsrgb --base 00ffa9 --ws FF0000 FFFF00 00FF00 0000FF 8800FF
    ignore_inhibit = true
}

listener {
    timeout = 900
    on-timeout = brightnessctl -s set 0%
    on-resume   = brightnessctl -r
    ignore_dbus_inhibit = false
}

listener {
    timeout = 3900
    on-timeout = flock -n /tmp/msi-rgb.lock -c '~/.local/bin/msi-kbc --off'
    on-resume   = ~/.local/bin/msi-wsrgb 00ffa9
}
