skip_selection = true

[background]
path = "/home/msi/.walls_catppuccin/serenity.jpg"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
font_name = "Noto Sans 14"
icon_theme_name = "Colloid-Catppuccin-Dark"
